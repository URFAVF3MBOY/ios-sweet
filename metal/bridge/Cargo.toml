[package]
name = "sweetmtl-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "C functions over metal2vulkan-runtime for SweetMTL.bundle (Metal on the OnePlus 7T's Adreno 640 through Turnip)"
license = "MIT"
publish = false

[lib]
name = "sweetmtl_bridge"
crate-type = ["staticlib"]
path = "lib.rs"

[dependencies]
# steelbrain/metal2vulkan (GPL-2.0-or-later OR LGPL-3.0-or-later), master of 2026-10-29
metal2vulkan-runtime = { git = "https://github.com/steelbrain/metal2vulkan", rev = "219f01365dc4c8eb346816c405b5b17403793764" }
metal2vulkan = { git = "https://github.com/steelbrain/metal2vulkan", rev = "219f01365dc4c8eb346816c405b5b17403793764" }
libc = "0.2"

[profile.release]
panic = "abort"
opt-level = 3
debug = 1
